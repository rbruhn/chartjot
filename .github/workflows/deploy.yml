# CI/CD Deployment Workflow with Semantic Versioning
#
# WORKFLOW:
# - Push to 'main' (via merged PR) → Calculates version → Builds Vite assets →
#   Deploys to PRODUCTION via Deployer → Creates GitHub release (only on success)
# - Push to 'development' does NOT trigger this workflow (no deploy target for it)
#
# VERSION CONTROL:
# Use commit message tags to control version bumps:
# - [major] or [breaking] → Major version bump (1.0.0 → 2.0.0)
# - [minor] or [feature] → Minor version bump (1.0.0 → 1.1.0)
# - Default (no tag) → Patch version bump (1.0.0 → 1.0.1)
#
# SKIP DEPLOYMENT:
# Add [skip deploy] or [no deploy] to your commit message to push without deploying
#

name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[no deploy]')"
    outputs:
      new_version: ${{ steps.new_version.outputs.new_version }}
      current_version: ${{ steps.version_bump.outputs.current_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: version_bump
        run: |
          # Select the highest semantic-version tag reachable from HEAD.
          LATEST_TAG="$(git tag --merged HEAD --list --sort=-version:refname | grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"

          if [[ -n "$LATEST_TAG" ]]; then
            echo "Latest tag: $LATEST_TAG"
            COMMITS="$(git log "${LATEST_TAG}..HEAD" --oneline)"
            CURRENT_VERSION="$LATEST_TAG"
          else
            echo "No semantic tags found; starting from 0.0.0"
            COMMITS="$(git log HEAD --oneline)"
            CURRENT_VERSION="0.0.0"
          fi

          echo "Commits since last tag:"
          echo "$COMMITS"

          # Get the specific commit message for this push (literal; do NOT let bash interpret `...`)
          CURRENT_COMMIT_MSG="$(cat <<'EOF'
          ${{ github.event.head_commit.message }}
          EOF
          )"

          echo "Current commit message:"
          printf '%s\n' "$CURRENT_COMMIT_MSG"

          # Determine version bump based on the current commit message only
          if printf '%s' "$CURRENT_COMMIT_MSG" | grep -Eqi '\[(major|breaking)\]'; then
            BUMP_TYPE="major"
          elif printf '%s' "$CURRENT_COMMIT_MSG" | grep -Eqi '\[(minor|feature)\]'; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi

          echo "Bump type: $BUMP_TYPE"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.version_bump.outputs.current_version }}"
          BUMP_TYPE="${{ steps.version_bump.outputs.bump_type }}"

          # Parse current version
          if [[ $CURRENT =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
          else
            MAJOR=0
            MINOR=0
            PATCH=0
          fi

          # Increment based on bump type
          case $BUMP_TYPE in
            "major")
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            "minor")
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            "patch")
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: calculate-version
    runs-on: ubuntu-latest
    environment: production
    if: "!contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[no deploy]')"
    # The repository is private: the server downloads this run's build artifact with GITHUB_TOKEN
    # (deploy:ci-artifacts), which needs actions: read on top of contents: read.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Create deployment package
        run: |
          rm -rf deployment-package
          mkdir -p deployment-package/public
          cp -r public/build deployment-package/public/build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: chartjot-${{ github.sha }}
          path: deployment-package/
          retention-days: 7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, bcmath, ctype, json, tokenizer, pdo, pdo_mysql

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies (for the Deployer CLI)
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      # Two keys in the agent: DEPLOY_PRIVATE_KEY logs in to the server; REPO_DEPLOY_KEY is a read-only
      # GitHub deploy key for this repository. Deployer forwards the agent, so the server clones over
      # SSH with REPO_DEPLOY_KEY without that key ever being stored on the server.
      - name: Setup SSH keys
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.DEPLOY_PRIVATE_KEY }}
            ${{ secrets.REPO_DEPLOY_KEY }}

      - name: Configure SSH host key checking
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/config

      - name: Deploy with Deployer
        run: vendor/bin/dep deploy production -o release_name=${{ github.run_number }}-${{ github.run_attempt }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}

  create-release:
    needs: [calculate-version, build-and-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "!contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[no deploy]')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Release
        run: |
          VERSION="${{ needs.calculate-version.outputs.new_version }}"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping creation."
            exit 0
          fi

          NOTES_FILE="$(mktemp)"

          cat > "$NOTES_FILE" <<'EOF'
          ## What's Changed

          Auto-generated release from main branch.

          **Commits included:**
          ```
          __COMMITS_HERE__
          ```

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ needs.calculate-version.outputs.current_version }}...${{ needs.calculate-version.outputs.new_version }}
          EOF

          # Replace placeholder with the commit message safely (no shell expansion)
          perl -0777 -pe 's/__COMMITS_HERE__/\Q$ENV{COMMIT_MESSAGE}\E/g' -i "$NOTES_FILE"

          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes-file "$NOTES_FILE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      # The NT8 AddOn as a NinjaScript archive for Tools > Import > NinjaScript (#88).
      # ubuntu-latest ships the .NET SDK; the net48 build uses reference assemblies from NuGet.
      - name: Attach the NT8 AddOn package
        run: |
          VERSION="${{ needs.calculate-version.outputs.new_version }}"
          ZIP="$(bash addon/package.sh "$RUNNER_TEMP/addon" | tail -n 1)"
          gh release upload "$VERSION" "$ZIP" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
